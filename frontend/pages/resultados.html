<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NABUUS • Resultados da busca</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Michroma&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/components/navbar.css">
  <link rel="stylesheet" href="../css/components/buttons.css">
  <link rel="stylesheet" href="../css/components/cards.css">
  <link rel="stylesheet" href="../css/components/forms.css">
  <link rel="stylesheet" href="../css/pages/layout.css">
</head>
<body>
  <header id="navbar-principal" class="navbar"></header>

  <main class="container-viajante">
    <section aria-labelledby="titulo-resultados">
      <h1 id="titulo-resultados" class="titulo-pagina">Viagens</h1>
      <p class="texto-secundario">Consulte naves, datas de partida, classes, propulsões e disponibilidade de Rota Lúmica.</p>

      <form id="form-busca-topo" class="barra-busca-topo" novalidate>
        <div class="campo">
          <label class="campo__rotulo" for="busca-origem">Origem</label>
          <input id="busca-origem" class="campo__controle" type="text" value="Terra · Sistema Solar" readonly>
        </div>
        <div class="campo">
          <label class="campo__rotulo" for="busca-destino">Destino</label>
          <select id="busca-destino" class="campo__select">
            <option value="">Todos os destinos</option>
          </select>
        </div>
        <div class="campo">
          <label class="campo__rotulo" for="busca-partida">Partida</label>
          <div class="campo-data">
            <input
              id="busca-partida"
              class="campo__controle campo-data__input"
              type="text"
              inputmode="numeric"
              maxlength="10"
              placeholder="dd/mm/aaaa"
              value="15/01/2100"
              required
            >
            <button
              id="btn-calendario-busca-partida"
              type="button"
              class="campo-data__botao"
              aria-label="Selecionar data de partida no calendário"
            >
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                <line x1="16" y1="2" x2="16" y2="6"></line>
                <line x1="8" y1="2" x2="8" y2="6"></line>
                <line x1="3" y1="10" x2="21" y2="10"></line>
              </svg>
            </button>
            <input id="busca-partida-picker" class="campo-data__picker" type="date" tabindex="-1" aria-hidden="true">
          </div>
        </div>
        <button type="submit" class="botao botao--secundario botao--grande">Atualizar busca →</button>
      </form>
      <p id="erro-busca-partida" class="campo__erro oculto" role="alert"></p>
    </section>

    <div class="layout-resultados">
      <aside class="lista-pilha" aria-label="Painel de filtros">
        <section class="card">
          <div class="viagem-card__topo">
            <h2>Filtrar viagens</h2>
            <button id="btn-limpar-filtros" type="button" class="viagem-card__link-lumica">Limpar</button>
          </div>
          <div class="card__divisor"></div>

          <div class="lista-pilha">
            <div class="check-grupo">
              <span class="campo__rotulo">Propulsão</span>
              <label class="check-item"><input type="checkbox" name="propulsao" value="Antimatéria"> Antimatéria</label>
              <label class="check-item"><input type="checkbox" name="propulsao" value="Fusão nuclear"> Fusão nuclear</label>
              <label class="check-item"><input type="checkbox" name="propulsao" value="Vela solar"> Vela solar</label>
            </div>

            <div class="card__divisor"></div>

            <div class="campo">
              <label class="campo__rotulo" for="filtro-distancia">Distância do destino</label>
              <select id="filtro-distancia" class="campo__select">
                <option value="Infinity">Qualquer distância</option>
                <option value="5">Até 5 anos-luz</option>
                <option value="15">Até 15 anos-luz</option>
                <option value="50">Até 50 anos-luz</option>
                <option value="200">Até 200 anos-luz</option>
              </select>
            </div>

            <button id="btn-aplicar-filtros" type="button" class="botao botao--primario botao--bloco">Aplicar filtros</button>
          </div>
        </section>
      </aside>

      <section class="lista-pilha" aria-label="Lista de resultados">
        <div class="viagem-card__topo">
          <div>
            <h2 id="contador-viagens">0 viagens encontradas</h2>
            <div id="chips-filtros" class="navbar__acoes"></div>
          </div>

          <div class="campo">
            <label class="sr-only" for="select-ordenacao">Ordenar resultados</label>
            <select id="select-ordenacao" class="campo__select">
              <option value="relevancia">Mais relevantes</option>
              <option value="menor-distancia">Menor distância</option>
            </select>
          </div>
        </div>

        <div id="lista-viagens" class="lista-pilha"></div>
      </section>
    </div>
  </main>

  <footer class="rodape">
    <div class="rodape__inner container-viajante">
      <span>NABUUS · Simulações exploratórias</span>
      <span>Quais são os limites da humanidade?</span>
    </div>
  </footer>

  <script type="module" src="../js/views/resultados-view.js"></script>
</body>
</html>
