<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NABUUS • Página inicial</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Michroma&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components/navbar.css">
  <link rel="stylesheet" href="css/components/buttons.css">
  <link rel="stylesheet" href="css/components/forms.css">
  <link rel="stylesheet" href="css/pages/layout.css">
</head>
<body class="pagina-hero">
  <header id="navbar-principal" class="navbar"></header>

  <main class="container-viajante hero">
    <section aria-labelledby="titulo-hero">
      <h1 id="titulo-hero" class="hero__titulo">NABUUS</h1>
      <p class="hero__subtitulo">Quais são os limites da humanidade?</p>
    </section>

    <form id="form-busca-inicial" class="hero__busca" novalidate>
      <div class="campo">
        <label class="campo__rotulo" for="select-destino">Destino</label>
        <select id="select-destino" class="campo__select" name="destino">
          <option value="">Digite ou selecione um destino</option>
        </select>
      </div>

      <div class="campo">
        <label class="campo__rotulo" for="input-data">Data de partida</label>
        <div class="campo-data">
          <input
            id="input-data"
            class="campo__controle campo-data__input"
            type="text"
            name="data"
            inputmode="numeric"
            maxlength="10"
            placeholder="dd/mm/aaaa"
            value="15/01/2100"
            required
          >
          <button
            id="btn-calendario-home"
            type="button"
            class="campo-data__botao"
            aria-label="Selecionar data de partida no calendário"
          >
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
              <line x1="16" y1="2" x2="16" y2="6"></line>
              <line x1="8" y1="2" x2="8" y2="6"></line>
              <line x1="3" y1="10" x2="21" y2="10"></line>
            </svg>
          </button>
          <input id="input-data-picker" class="campo-data__picker" type="date" tabindex="-1" aria-hidden="true">
        </div>
      </div>

      <button type="submit" class="botao botao--primario botao--grande">
        Explorar viagens →
      </button>
    </form>
    <p id="erro-input-data" class="campo__erro oculto" role="alert"></p>
  </main>

  <script type="module" src="js/views/home-view.js"></script>
</body>
</html>
